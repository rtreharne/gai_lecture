<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071018" />
  <meta name="description" content="BIOS105 interactive lecture: AI as a Bioscience Superpower—With You in Charge." />
  <title>AI as a Bioscience Superpower</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <main id="deck" aria-live="polite"></main>
  <nav class="controls" aria-label="Presentation controls">

    <button id="overview" aria-label="Show slide overview">▦</button>
  </nav>
  <div id="overviewPanel" class="overview-panel" hidden>
    <div class="overview-head"><span>BIOS105 / AI SUPERPOWER</span><button id="closeOverview">×</button></div>
    <div id="overviewGrid" class="overview-grid"></div>
  </div>
  <div id="help" class="help" hidden>
    <strong>Controls</strong><br>← → / Space navigate · Home / End jump · F fullscreen · P overview · Esc close
  </div>
  <script src="js/content.js"></script>
  <script src="js/deck.js"></script>
